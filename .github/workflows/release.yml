name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          for arch in amd64 arm64; do
            master_dir="release/master-${arch}"
            agent_dir="release/agent-${arch}"
            mkdir -p "${master_dir}/bin" "${master_dir}/frontend" "${master_dir}/scripts"
            mkdir -p "${agent_dir}/bin" "${agent_dir}/scripts"

            (
              cd backend
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "../${master_dir}/bin/proxy-control" .
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "../${agent_dir}/bin/proxy-control-agent" ./cmd/agent
            )

            cp -a frontend/dist "${master_dir}/frontend/dist"
            cp scripts/install-master.sh "${master_dir}/scripts/install-master.sh"
            cp scripts/install-agent.sh "${agent_dir}/scripts/install-agent.sh"
            chmod 0755 "${master_dir}/bin/proxy-control" "${master_dir}/scripts/install-master.sh"
            chmod 0755 "${agent_dir}/bin/proxy-control-agent" "${agent_dir}/scripts/install-agent.sh"

            tar -C "${master_dir}" -czf "release/fyss-master-linux-${arch}.tar.gz" .
            tar -C "${agent_dir}" -czf "release/fyss-agent-linux-${arch}.tar.gz" .
          done
          cd release
          sha256sum fyss-*.tar.gz > checksums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fyss-linux-packages
          path: |
            release/fyss-*.tar.gz
            release/checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "fyss 二进制安装包"
          gh release upload "$tag" release/fyss-*.tar.gz release/checksums.txt --clobber
